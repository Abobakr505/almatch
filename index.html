<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>الماتش</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Beiruti:wght@300;400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./css/style.css">
<link rel="shortcut icon" href="./imgs/ball.png" type="image/png">
</head>
<body>
<div class="app">

  <!-- HOME -->
  <div class="screen active" id="s-home">
    <div style="font-size:3.2rem;margin:1rem 0 .1rem">⚽</div>
    <div class="page-title">الماتش</div>
    <div class="page-sub">اختر نوع اللعبة</div>
    <div class="grid2" style="margin-top:.4rem">
      <button class="big-btn" onclick="go('s-hagz')">
        <span class="ico">🏟️</span>
        <span class="lbl">حجز</span>
        <span class="dsc">تحديد وقت</span>
      </button>
      <button class="big-btn" onclick="go('s-share3')">
        <span class="ico">🏃</span>
        <span class="lbl">شارع</span>
        <span class="dsc">تحديد أهداف</span>
      </button>
    </div>
  </div>

  <!-- HAGZ - وقت مخصص -->
  <div class="screen" id="s-hagz">
    <button class="back-btn" onclick="go('s-home')">&#8594; رجوع</button>
    <div class="page-title">🏟️ حجز</div>
    <div class="picker-card">
      <div class="picker-label">مدة المباراة</div>
      <div class="picker-row">
        <button class="num-btn" onclick="changeTime(-5)">−</button>
        <div class="num-val" id="time-val">60</div>
        <div class="num-unit">دقيقة</div>
        <button class="num-btn" onclick="changeTime(5)">+</button>
      </div>
      <div style="display:flex;gap:.5rem;flex-wrap:wrap">
        <button class="ctrl-btn" onclick="setTime(30)">30 د</button>
        <button class="ctrl-btn" onclick="setTime(45)">45 د</button>
        <button class="ctrl-btn" onclick="setTime(60)">60 د</button>
        <button class="ctrl-btn" onclick="setTime(90)">90 د</button>
        <button class="ctrl-btn" onclick="setTime(120)">120 د</button>
      </div>
    </div>
    <button class="go-btn" onclick="initMatch('time', getTime())">
      ابدأ ▶
    </button>
  </div>

  <!-- SHARE3 - أهداف مخصصة -->
  <div class="screen" id="s-share3">
    <button class="back-btn" onclick="go('s-home')">&#8594; رجوع</button>
    <div class="page-title">🏃 شارع</div>
    <div class="picker-card">
      <div class="picker-label">عدد الأهداف للفوز</div>
      <div class="picker-row">
        <button class="num-btn" onclick="changeGoals(-1)">−</button>
        <div class="num-val" id="goals-val">4</div>
        <div class="num-unit">أهداف</div>
        <button class="num-btn" onclick="changeGoals(1)">+</button>
      </div>
      <div style="display:flex;gap:.5rem;flex-wrap:wrap">
        <button class="ctrl-btn" onclick="setGoals(1)">1</button>
        <button class="ctrl-btn" onclick="setGoals(2)">2</button>
        <button class="ctrl-btn" onclick="setGoals(3)">3</button>
        <button class="ctrl-btn" onclick="setGoals(4)">4</button>
        <button class="ctrl-btn" onclick="setGoals(5)">5</button>
        <button class="ctrl-btn" onclick="setGoals(6)">6</button>
        <button class="ctrl-btn" onclick="setGoals(7)">7</button>
        <button class="ctrl-btn" onclick="setGoals(10)">10</button>
      </div>
    </div>
    <button class="go-btn" onclick="initMatch('goals', getGoals())">
      ابدأ ▶
    </button>
  </div>

  <!-- MATCH -->
  <div class="screen" id="s-match">
    <button class="back-btn" onclick="leaveMatch()">&#8594; رجوع</button>
    <div class="header-row">
      <div class="mode-badge" id="m-badge"></div>
      <div class="timer-box" id="m-timer"></div>
    </div>
    <div id="m-result" style="display:none;width:100%">
      <div class="result-banner" id="m-banner">
        <div class="result-lbl" id="m-rlbl">🏆 الفائز</div>
        <div class="result-name" id="m-rname"></div>
      </div>
    </div>
    <div class="teams-grid">
      <div class="team-card">
        <input class="t-name" id="n1" value="الفريق 1" maxlength="10">
        <div class="t-score" id="sc1">0</div>
        <button class="goal-btn" id="gb1" onclick="goal(1)" disabled>⚽ هدف</button>
      </div>
      <div class="vs">VS</div>
      <div class="team-card">
        <input class="t-name" id="n2" value="الفريق 2" maxlength="10">
        <div class="t-score" id="sc2">0</div>
        <button class="goal-btn" id="gb2" onclick="goal(2)" disabled>⚽ هدف</button>
      </div>
    </div>
    <button class="start-btn" id="m-startbtn" onclick="beginMatch()">
      ▶ ابدأ المباراة
    </button>
    <div class="ctrl-row">
      <button class="ctrl-btn" onclick="undo(1)">− تراجع ف١</button>
      <button class="ctrl-btn" onclick="undo(2)">− تراجع ف٢</button>
      <button class="ctrl-btn" id="m-rematch" style="display:none" onclick="rematch()">إعادة المباراة</button>
      <button class="ctrl-btn" id="m-newgame" style="display:none" onclick="newGame()">مباراة جديدة</button>
    </div>
  </div>

</div>

<script src="./js/script.js"></script>
</body>
</html>
